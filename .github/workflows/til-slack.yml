name: Run Notion Slack Reminder

on:
    schedule:
        # 정각(00분)은 GitHub Actions 큐가 가장 붐비는 시간이라 1분 앞당겨 59분에 건다.
        - cron: "59 17 * * 1-5" # UTC 17:59 = KST 02:59 (화~토)
    workflow_dispatch: # 수동 실행 가능

jobs:
    run-script:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run script
              env:
                  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
                  TIL_NOTION_DATABASE_ID: ${{ secrets.TIL_NOTION_DATABASE_ID }}
                  TIL_SLACK_WEBHOOK_URL: ${{ secrets.TIL_SLACK_WEBHOOK_URL }}
                  TIL_REST_DATABASE_ID: ${{ secrets.TIL_REST_DATABASE_ID }}
              run: npm run start
